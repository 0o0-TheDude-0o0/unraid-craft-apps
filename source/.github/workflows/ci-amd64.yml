name: Build and test amd64

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested master image to GHCR
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - Dockerfile
      - build/**
      - versions/**
      - root/**
      - .github/workflows/ci-amd64.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: craft-apps-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Require master for publishing
        if: ${{ inputs.publish && github.ref != 'refs/heads/master' }}
        run: |
          echo 'Publishing is only allowed from master.' >&2
          exit 1

      - name: Require matching public source snapshot
        if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/0o0-TheDude-0o0/unraid-craft-apps/main/SOURCE_COMMIT)"
          if [[ "$source_revision" != "$GITHUB_SHA" ]]; then
            echo "Public source snapshot does not match build revision $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Free space on the hosted runner
        shell: bash
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: craft-apps:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=craft-apps-amd64
          cache-to: type=gha,scope=craft-apps-amd64,mode=max

      - name: Check apps and desktop service
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name craft-apps-ci \
            --shm-size=1g \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -p 127.0.0.1:3001:3001 \
            craft-apps:ci
          trap 'docker logs --tail 100 craft-apps-ci || true; docker rm -f -v craft-apps-ci >/dev/null || true' EXIT

          for attempt in {1..60}; do
            if [[ "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://127.0.0.1:3001/ || true)" == 200 ]]; then
              break
            fi
            sleep 2
          done
          [[ "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://127.0.0.1:3001/)" == 200 ]]
          docker logs craft-apps-ci 2>&1 | grep -F '[ls.io-init] done.'

          docker exec craft-apps-ci /bin/bash -lc '
            set -e
            for app in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft anicraft designcraft figcraft texturecraft materialcraft soundcraft wordcraft deckcraft cadcraft gridcraft craft-anything; do
              command -v "$app" >/dev/null
              test -f "/usr/share/applications/ai.storyteller.${app}.desktop"
              "$app" --version >/dev/null 2>&1
            done
          '

          docker restart craft-apps-ci >/dev/null
          for attempt in {1..60}; do
            if [[ "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://127.0.0.1:3001/ || true)" == 200 ]]; then
              break
            fi
            sleep 2
          done
          [[ "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://127.0.0.1:3001/)" == 200 ]]

      - name: Publish tested image to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag craft-apps:ci "$image:sha-${GITHUB_SHA:0:12}"
          docker tag craft-apps:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA:0:12}"
          docker push "$image:latest"

name: Check ArtCraft releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report release changes without committing them
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: craft-app-release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ startsWith(github.ref, 'refs/heads/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Test release checker
        run: python3 -m unittest discover -s tests -p test_release_checker.py

      - name: Check upstream releases
        id: releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            python3 build/check-releases.py --dry-run
          else
            python3 build/check-releases.py
          fi
          if git diff --quiet -- versions; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed locks
        if: ${{ steps.releases.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- versions/*.lock
          git commit -m 'Update ArtCraft app releases'
          git push origin "HEAD:${GITHUB_REF}"

      - name: Start image build and test
        if: ${{ steps.releases.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci-amd64.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
